name: Build APK V16 — IPTV player

on:
  workflow_dispatch:
  push:
    paths:
      - project.zip

permissions:
  contents: write
  actions: read

concurrency:
  group: htmltoapk-v16-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: "IPTV player"
  EXPECTED_PACKAGE: "com.yoann.monapplication"
  EXPECTED_VERSION_CODE: "207866603"
  EXPECTED_VERSION_NAME: "1.0.0"
  APK_FILENAME: "IPTV-player-com.yoann.monapplication-v207866603-debug.apk"
  PROJECT_ROOT: "generated"
  BUILD_TOOLS_VERSION: "35.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Récupérer le dépôt
        id: checkout
        uses: actions/checkout@v5
        continue-on-error: true
        with:
          fetch-depth: 0

      - name: Initialiser le diagnostic V16
        id: init
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p diagnostics apk-output
          : > diagnostics/workflow.log
          {
            echo "IPTV player V16"
            echo "run_id=${{ github.run_id }}"
            echo "run_number=${{ github.run_number }}"
            echo "repository=${{ github.repository }}"
            echo "ref=${{ github.ref }}"
            echo "sha=${{ github.sha }}"
            echo "started_at=$(date -u +%FT%TZ)"
          } | tee diagnostics/run-context.txt

      - name: Extraire et contrôler project.zip
        id: extract
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee -a diagnostics/workflow.log) 2>&1
          set -Eeuo pipefail
          STAGE="extraction_project_zip"
          trap 'CODE=$?; printf "stage=%s\nexit_code=%s\ndate=%s\n" "$STAGE" "$CODE" "$(date -u +%FT%TZ)" > diagnostics/failure-stage.txt; exit "$CODE"' ERR
          rm -rf generated
          mkdir -p generated
          test -s project.zip
          python3 - <<'PYZIP'
          import collections, pathlib, shutil, zipfile
          archive = pathlib.Path("project.zip")
          destination = pathlib.Path("generated")
          if destination.exists():
              shutil.rmtree(destination)
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              files = [info for info in zf.infolist() if not info.is_dir()]
              counts = collections.Counter(info.filename.lower() for info in files)
              duplicates = sorted(name for name, count in counts.items() if count > 1)
              pathlib.Path("diagnostics/project-zip-duplicates.txt").write_text(
                  "
".join(duplicates), encoding="utf-8"
              )
              for info in zf.infolist():
                  zf.extract(info, destination)
          print(f"Archive extraite sans interaction : {len(files)} fichier(s), {len(duplicates)} doublon(s).")
          PYZIP
          printf "sha256=%s\nsize=%s\n" "$(sha256sum project.zip | awk '{print $1}')" "$(stat -c %s project.zip)" > diagnostics/project-zip-info.txt

      - name: Installer Java 17
        id: java
        if: always()
        continue-on-error: true
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.9
        id: gradle
        if: always()
        continue-on-error: true
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Installer Android SDK
        id: android
        if: always()
        continue-on-error: true
        uses: android-actions/setup-android@v3

      - name: Installer Android 35 et les outils de compilation
        id: sdk
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee -a diagnostics/workflow.log) 2>&1
          set -Eeuo pipefail
          STAGE="installation_android_sdk"
          trap 'CODE=$?; printf "stage=%s\nexit_code=%s\ndate=%s\n" "$STAGE" "$CODE" "$(date -u +%FT%TZ)" > diagnostics/failure-stage.txt; exit "$CODE"' ERR
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;${BUILD_TOOLS_VERSION}" "platform-tools"

      - name: Prédiagnostic de l’environnement
        id: environment
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          {
            echo "=== DATE ==="
            date -u +%FT%TZ
            echo "=== SYSTÈME ==="
            uname -a
            echo "=== JAVA ==="
            java -version 2>&1 || true
            echo "=== GRADLE ==="
            gradle --version 2>&1 || true
            echo "=== ANDROID ==="
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            command -v sdkmanager || true
            command -v adb || true
            sdkmanager --list_installed 2>&1 | head -n 180 || true
            echo "=== ESPACE DISQUE ==="
            df -h
            echo "=== MÉMOIRE ==="
            free -h || true
          } > diagnostics/environment.txt 2>&1
          cat diagnostics/environment.txt >> diagnostics/workflow.log

      - name: Vérifier et normaliser le projet Android
        id: preflight
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee -a diagnostics/workflow.log) 2>&1
          set -Eeuo pipefail
          STAGE="verification_projet_android"
          trap 'CODE=$?; printf "stage=%s\nexit_code=%s\ndate=%s\n" "$STAGE" "$CODE" "$(date -u +%FT%TZ)" > diagnostics/failure-stage.txt; exit "$CODE"' ERR
          cd "$PROJECT_ROOT"
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/www/index.html
          python3 - <<'PYFIX'
          from pathlib import Path
          p=Path('gradle.properties')
          defaults={
              'org.gradle.jvmargs':'-Xmx3072m -Dfile.encoding=UTF-8',
              'org.gradle.daemon':'false',
              'org.gradle.parallel':'false',
              'android.useAndroidX':'true',
              'android.enableJetifier':'true',
          }
          lines=[]
          if p.exists():
              text=p.read_text(encoding='utf-8',errors='replace').replace('\\n','\n')
              for raw in text.splitlines():
                  line=raw.strip()
                  if not line or line.startswith('#'): continue
                  if line.startswith('android.nonTransitiveRClass='): continue
                  if line.startswith('android.useAndroidX='): continue
                  if line.startswith('android.enableJetifier='): continue
                  lines.append(line)
          data={}
          order=[]
          for line in lines:
              key=line.split('=',1)[0]
              if key not in data: order.append(key)
              data[key]=line
          for key,value in defaults.items():
              if key not in data: order.append(key)
              data[key]=f'{key}={value}'
          p.write_text('\n'.join(data[k] for k in order)+'\n',encoding='utf-8')
          print(p.read_text(encoding='utf-8'))
          PYFIX
          grep -q 'com.android.application' app/build.gradle.kts
          grep -q 'compileSdk = 35' app/build.gradle.kts
          printf "preflight=ok\n" > "$GITHUB_WORKSPACE/diagnostics/preflight.txt"

      - name: Préparer la signature Android stable
        id: signing
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          exec > >(tee -a diagnostics/workflow.log) 2>&1
          set -Eeuo pipefail
          STAGE="signature_android"
          trap 'CODE=$?; printf "stage=%s\nexit_code=%s\ndate=%s\n" "$STAGE" "$CODE" "$(date -u +%FT%TZ)" > diagnostics/failure-stage.txt; exit "$CODE"' ERR
          mkdir -p .signing "$PROJECT_ROOT/.signing"
          KEYSTORE=".signing/html-apk-stable.p12"
          FINGERPRINT_FILE=".signing/html-apk-stable.sha256"
          CREATED=0
          if [ ! -s "$KEYSTORE" ]; then
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -storepass "HTML_APK_BUILDER_STABLE_2026" \
              -keypass "HTML_APK_BUILDER_STABLE_2026" \
              -alias "html-apk-stable" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=HTML APK Builder, OU=Local Apps, O=GhostBuilder, L=Paris, ST=Ile-de-France, C=FR"
            CREATED=1
          fi
          CURRENT_FP=$(keytool -list -v \
            -keystore "$KEYSTORE" \
            -storetype PKCS12 \
            -storepass "HTML_APK_BUILDER_STABLE_2026" \
            -alias "html-apk-stable" 2>/dev/null \
            | awk -F'SHA256: ' '/SHA256:/{gsub(":","",$2); print tolower($2); exit}')
          test -n "$CURRENT_FP"
          OLD_FP=$(tr -d '[:space:]' < "$FINGERPRINT_FILE" 2>/dev/null || true)
          if [ -n "$OLD_FP" ] && [ "$OLD_FP" != "$CURRENT_FP" ]; then
            echo "::warning title=Signature Android::Empreinte corrigée pour correspondre à la clé réellement présente."
          fi
          printf '%s\n' "$CURRENT_FP" > "$FINGERPRINT_FILE"
          if [ "$PROJECT_ROOT" != "." ]; then
            cp "$KEYSTORE" "$PROJECT_ROOT/.signing/html-apk-stable.p12"
            cp "$FINGERPRINT_FILE" "$PROJECT_ROOT/.signing/html-apk-stable.sha256"
          fi
          {
            echo "created=$CREATED"
            echo "sha256=$CURRENT_FP"
            keytool -list -v -keystore "$KEYSTORE" -storetype PKCS12 -storepass "HTML_APK_BUILDER_STABLE_2026" -alias html-apk-stable 2>&1 | grep -E "Alias name:|SHA256:|Valid from:" || true
          } > diagnostics/signing.txt

      - name: Compiler l’APK et capturer tout le journal
        id: compile
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set +e
          set -o pipefail
          echo "compile_started_at=$(date -u +%FT%TZ)" > "$GITHUB_WORKSPACE/diagnostics/compile-status.txt"
          command -v gradle >> "$GITHUB_WORKSPACE/diagnostics/compile-status.txt" 2>&1
          gradle --no-daemon --console=plain :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "$BUILD_EXIT" > "$GITHUB_WORKSPACE/build-exit-code.txt"
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_WORKSPACE/diagnostics/compile-status.txt"
          echo "compile_finished_at=$(date -u +%FT%TZ)" >> "$GITHUB_WORKSPACE/diagnostics/compile-status.txt"
          echo "exit_code=$BUILD_EXIT" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Préparer et vérifier l’APK
        id: verify_apk
        if: ${{ always() && steps.compile.outputs.exit_code == '0' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p apk-output
          SOURCE_APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          DEST_APK="apk-output/$APK_FILENAME"
          READY=false
          {
            echo "source=$SOURCE_APK"
            echo "destination=$DEST_APK"
            test -s "$SOURCE_APK" || { echo "APK source absent"; exit 10; }
            cp "$SOURCE_APK" "$DEST_APK"
            echo "size=$(stat -c %s "$DEST_APK")"
            echo "sha256=$(sha256sum "$DEST_APK" | awk '{print $1}')"
            AAPT="${ANDROID_HOME:-}/build-tools/${BUILD_TOOLS_VERSION}/aapt"
            APKSIGNER="${ANDROID_HOME:-}/build-tools/${BUILD_TOOLS_VERSION}/apksigner"
            test -x "$AAPT"
            test -x "$APKSIGNER"
            "$AAPT" dump badging "$DEST_APK" | head -n 12
            "$APKSIGNER" verify --verbose --print-certs "$DEST_APK"
            ACTUAL_PACKAGE=$("$AAPT" dump badging "$DEST_APK" | awk -F"'" '/^package: name=/{print $2; exit}')
            ACTUAL_VERSION=$("$AAPT" dump badging "$DEST_APK" | awk -F"'" '/^package: name=/{print $4; exit}')
            echo "actual_package=$ACTUAL_PACKAGE"
            echo "actual_version_code=$ACTUAL_VERSION"
            echo "expected_package=$EXPECTED_PACKAGE"
            echo "expected_version_code=$EXPECTED_VERSION_CODE"
            test "$ACTUAL_PACKAGE" = "$EXPECTED_PACKAGE"
            test "$ACTUAL_VERSION" = "$EXPECTED_VERSION_CODE"
          } 2>&1 | tee apk-output/apk-verification.txt
          VERIFY_EXIT=${PIPESTATUS[0]}
          if [ "$VERIFY_EXIT" -eq 0 ]; then READY=true; fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "$VERIFY_EXIT" > diagnostics/apk-verification-exit-code.txt
          exit 0

      - name: Publier l’APK comme artefact
        id: upload_apk
        if: ${{ always() && steps.verify_apk.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: "IPTV-player-apk-v16"
          path: |
            apk-output/*.apk
            apk-output/apk-verification.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publier l’APK dans la Release generated-apk
        id: release
        if: ${{ always() && steps.verify_apk.outputs.ready == 'true' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view generated-apk >/dev/null 2>&1; then
            gh release upload generated-apk apk-output/*.apk apk-output/apk-verification.txt --clobber
          else
            gh release create generated-apk apk-output/*.apk apk-output/apk-verification.txt \
              --title "APK généré par IPTV player V16" \
              --notes "Compilation Android automatique avec journal de diagnostic complet."
          fi

      - name: Générer le diagnostic complet V16
        id: report
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo "============================================================"
            echo " DIAGNOSTIC COMPLET HTMLTOAPK V16"
            echo "============================================================"
            echo "Date UTC : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Application : $APP_NAME"
            echo "Package attendu : $EXPECTED_PACKAGE"
            echo "Version attendue : $EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE)"
            echo "Dépôt : $GITHUB_REPOSITORY"
            echo "Branche : $GITHUB_REF_NAME"
            echo "Commit : $GITHUB_SHA"
            echo "Run : #$GITHUB_RUN_NUMBER"
            echo "URL : https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "=== RÉSULTAT DES ÉTAPES ==="
            echo "checkout=${{ steps.checkout.outcome }}"
            echo "initialisation=${{ steps.init.outcome }}"
            echo "extraction=${{ steps.extract.outcome }}"
            echo "java=${{ steps.java.outcome }}"
            echo "gradle=${{ steps.gradle.outcome }}"
            echo "android_sdk_action=${{ steps.android.outcome }}"
            echo "android_packages=${{ steps.sdk.outcome }}"
            echo "environment=${{ steps.environment.outcome }}"
            echo "preflight=${{ steps.preflight.outcome }}"
            echo "signature=${{ steps.signing.outcome }}"
            echo "compilation_step=${{ steps.compile.outcome }}"
            echo "gradle_exit_code=${{ steps.compile.outputs.exit_code }}"
            echo "verification_step=${{ steps.verify_apk.outcome }}"
            echo "apk_ready=${{ steps.verify_apk.outputs.ready }}"
            echo "upload_apk=${{ steps.upload_apk.outcome }}"
            echo "release=${{ steps.release.outcome }}"
            echo
            echo "=== ÉTAPE D’ÉCHEC CAPTURÉE ==="
            cat diagnostics/failure-stage.txt 2>/dev/null || echo "Aucune étape shell n’a enregistré d’échec avant Gradle."
            echo
            echo "=== CODE DE SORTIE GRADLE ==="
            cat build-exit-code.txt 2>/dev/null || echo "indisponible"
            echo
            echo "=== ANALYSE AUTOMATIQUE ==="
            FOUND=0
            if [ "${{ steps.checkout.outcome }}" = "failure" ]; then echo "- Échec de récupération du dépôt."; FOUND=1; fi
            if [ "${{ steps.extract.outcome }}" = "failure" ]; then echo "- project.zip est absent, corrompu ou mal structuré."; FOUND=1; fi
            if [ "${{ steps.java.outcome }}" = "failure" ]; then echo "- Installation de Java 17 en échec."; FOUND=1; fi
            if [ "${{ steps.gradle.outcome }}" = "failure" ]; then echo "- Installation de Gradle 8.9 en échec."; FOUND=1; fi
            if [ "${{ steps.sdk.outcome }}" = "failure" ]; then echo "- Installation Android SDK 35 en échec."; FOUND=1; fi
            if [ "${{ steps.preflight.outcome }}" = "failure" ]; then echo "- Structure ou configuration du projet Android invalide."; FOUND=1; fi
            if [ -f build.log ]; then
              grep -Eqi "Android resource linking failed" build.log && { echo "- Ressource Android/XML invalide."; FOUND=1; }
              grep -Eqi "Manifest merger failed" build.log && { echo "- Conflit dans AndroidManifest.xml."; FOUND=1; }
              grep -Eqi "error: cannot find symbol|package .+ does not exist" build.log && { echo "- Erreur Java : symbole ou package manquant."; FOUND=1; }
              grep -Eqi "Could not resolve|Could not find .+:" build.log && { echo "- Dépendance Gradle introuvable ou réseau indisponible."; FOUND=1; }
              grep -Eqi "Unsupported class file major version|invalid source release|Minimum supported Gradle version|Maximum supported Gradle JVM" build.log && { echo "- Incompatibilité Java, Gradle ou plugin Android."; FOUND=1; }
              grep -Eqi "OutOfMemoryError" build.log && { echo "- Mémoire insuffisante pendant la compilation."; FOUND=1; }
              grep -Eqi "Execution failed for task|FAILURE: Build failed" build.log && { echo "- Une tâche Gradle a échoué ; consulter les erreurs extraites."; FOUND=1; }
            fi
            [ "$FOUND" -eq 1 ] || echo "- Aucun motif connu détecté ; consulter le journal complet."
            echo
            echo "=== INFORMATIONS SUR project.zip ==="
            cat diagnostics/project-zip-info.txt 2>/dev/null || true
            cat diagnostics/project-zip-test.txt 2>/dev/null || true
            echo "=== ERREURS EXTRAITES DU JOURNAL GRADLE ==="
            if [ -f build.log ]; then
              grep -nEi "error:|FAILURE:|What went wrong|A problem occurred|Execution failed|Could not|Exception|Caused by:|failed" build.log | tail -n 400 || true
            else
              echo "build.log absent : l’échec est antérieur à Gradle ou Gradle n’a pas pu démarrer."
            fi
            echo
            echo "=== 800 DERNIÈRES LIGNES DU JOURNAL GRADLE ==="
            tail -n 800 build.log 2>/dev/null || echo "Journal Gradle indisponible."
            echo
            echo "=== VÉRIFICATION APK ==="
            cat apk-output/apk-verification.txt 2>/dev/null || echo "Vérification APK indisponible."
            echo
            echo "=== SIGNATURE ANDROID ==="
            cat diagnostics/signing.txt 2>/dev/null || echo "Diagnostic de signature absent."
            echo
            echo "=== ENVIRONNEMENT ==="
            cat diagnostics/environment.txt 2>/dev/null || true
            echo
            echo "=== JOURNAL DES ÉTAPES SHELL ==="
            cat diagnostics/workflow.log 2>/dev/null || true
            echo
            echo "=== STRUCTURE DU PROJET ==="
            find "$PROJECT_ROOT" -maxdepth 10 -type f -printf '%p | %s octets\n' 2>/dev/null | sort | head -n 3500 || true
            echo
            echo "=== settings.gradle.kts ==="
            sed -n '1,500p' "$PROJECT_ROOT/settings.gradle.kts" 2>/dev/null || true
            echo
            echo "=== build.gradle.kts ==="
            sed -n '1,500p' "$PROJECT_ROOT/build.gradle.kts" 2>/dev/null || true
            echo
            echo "=== app/build.gradle.kts ==="
            sed -n '1,800p' "$PROJECT_ROOT/app/build.gradle.kts" 2>/dev/null || true
            echo
            echo "=== gradle.properties ==="
            sed -n '1,300p' "$PROJECT_ROOT/gradle.properties" 2>/dev/null || true
            echo
            echo "=== AndroidManifest.xml ==="
            sed -n '1,800p' "$PROJECT_ROOT/app/src/main/AndroidManifest.xml" 2>/dev/null || true
            echo
            echo "=== DIAGNOSTIC LOCAL WEB ==="
            cat "$PROJECT_ROOT/LOCAL_WEB_DIAGNOSTIC.txt" 2>/dev/null || echo "Diagnostic local absent."
            echo
            echo "=== FICHIERS PRODUITS ==="
            find apk-output -maxdepth 2 -type f -printf '%p | %s octets\n' 2>/dev/null || true
            echo
            echo "============================================================"
            echo " FIN DU DIAGNOSTIC V16"
            echo "============================================================"
          } > diagnostics/diagnostic-complet-v16.txt 2>&1
          cp diagnostics/diagnostic-complet-v16.txt diagnostics/latest-diagnostic.txt
          {
            echo "compile_exit=${{ steps.compile.outputs.exit_code }}"
            echo "apk_ready=${{ steps.verify_apk.outputs.ready }}"
            echo "diagnostic=diagnostics/diagnostic-complet-v16.txt"
            echo "apk=apk-output/$APK_FILENAME"
          } > diagnostics/result.properties

      - name: Publier tous les diagnostics V16
        id: upload_diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: diagnostic-complet-apk-run-${{ github.run_number }}
          path: |
            diagnostics/**
            build.log
            build-exit-code.txt
            apk-output/apk-verification.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Sauvegarder la signature et le diagnostic dans le dépôt
        id: persist
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .signing/html-apk-stable.p12 .signing/html-apk-stable.sha256 diagnostics/latest-diagnostic.txt diagnostics/diagnostic-complet-v16.txt 2>/dev/null
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "IPTV player V16 diagnostic #${{ github.run_number }} [skip ci]" || exit 0
          for ATTEMPT in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((ATTEMPT * 2))
          done
          echo "::warning title=Sauvegarde du diagnostic::Le diagnostic reste disponible dans les artefacts, mais son commit a échoué."
          exit 0

      - name: Valider le résultat final
        if: always()
        shell: bash
        run: |
          COMPILE_EXIT="${{ steps.compile.outputs.exit_code }}"
          APK_READY="${{ steps.verify_apk.outputs.ready }}"
          echo "Compilation Gradle : $COMPILE_EXIT"
          echo "APK validé : $APK_READY"
          if [ "$COMPILE_EXIT" != "0" ]; then
            echo "::error title=Compilation APK::Gradle a échoué. Télécharge l’artefact diagnostic-complet-apk-run-${{ github.run_number }}."
            exit 1
          fi
          if [ "$APK_READY" != "true" ]; then
            echo "::error title=Vérification APK::La compilation a terminé mais l’APK n’a pas été validé."
            exit 1
          fi
          echo "APK généré et vérifié avec succès : $APK_FILENAME"
